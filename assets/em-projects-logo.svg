<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="EM Projects">
  <defs>
    <linearGradient id="em-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001F3F"/>
      <stop offset="45%" stop-color="#0066A3"/>
      <stop offset="100%" stop-color="#00CED1"/>
    </linearGradient>
    <linearGradient id="em-shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#fff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="letter-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#E0F7FA"/>
    </linearGradient>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Base tile -->
  <rect width="48" height="48" rx="11" fill="url(#em-bg)"/>
  <!-- Inner border ring -->
  <rect x="1.5" y="1.5" width="45" height="45" rx="9.5" fill="none" stroke="#40E0D0" stroke-opacity="0.45" stroke-width="1"/>
  <!-- Glass highlight -->
  <rect width="48" height="48" rx="11" fill="url(#em-shine)"/>
  <!-- Bubbles -->
  <circle cx="38" cy="11" r="2.2" fill="#fff" fill-opacity="0.2"/>
  <circle cx="34" cy="16" r="1.2" fill="#fff" fill-opacity="0.12"/>
  <circle cx="10" cy="12" r="1.5" fill="#40E0D0" fill-opacity="0.35"/>
  <!-- Letters -->
  <g filter="url(#soft-glow)">
    <path fill="url(#letter-fill)" d="M8 14.5h11v2.2H11.2v3h6.8v2.2H11.2v3.6h8.8v2.2H8V14.5z"/>
    <path fill="url(#letter-fill)" d="M21.5 14.5h14.2v13.5h-2.7l-4.1-7.8-4.1 7.8h-2.7V14.5z"/>
  </g>
  <!-- Accent wave + sparkle -->
  <path fill="none" stroke="#40E0D0" stroke-width="1.8" stroke-linecap="round"
    d="M9 36.5c4.5-2 9-2 15 0s10.5 2 15 0"/>
  <path fill="none" stroke="#fff" stroke-width="1" stroke-linecap="round" stroke-opacity="0.5"
    d="M11 35c3.5-1.2 7-1.2 13 0s9.5 1.2 13 0"/>
  <circle cx="37" cy="34" r="1" fill="#fff" fill-opacity="0.7"/>
</svg>
